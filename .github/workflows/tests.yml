name: ToolNest regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check js/advanced-converters.js
          node --check js/finance-calculators.js
          node --experimental-default-type=module --check js/router.js
          node --check js/live-search.js
          node --check js/seo-content.js
      - name: Run regression tests
        run: node --experimental-default-type=module --test tests/*.test.mjs
